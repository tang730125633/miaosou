<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">秒搜 Miaosou</title>
  <desc id="desc">A warm-paper editorial hero showing Miaosou replacing Command Space with personal application, file, and website search.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#171612" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="28" fill="#f1eee4"/>
  <rect width="1200" height="400" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="398" rx="27" fill="none" stroke="#171612" stroke-opacity="0.24" stroke-width="2"/>

  <g transform="translate(58 50)">
    <circle cx="7" cy="8" r="7" fill="#d65336"/>
    <text x="24" y="15" fill="#6e6a61" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">MACOS / PERSONAL LAUNCHER / V0.7.0</text>
    <text x="0" y="116" fill="#171612" font-family="Georgia, 'Songti SC', serif" font-size="88" font-weight="700">秒搜</text>
    <text x="6" y="151" fill="#d65336" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="7">MIAOSOU</text>
    <text x="0" y="211" fill="#171612" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="27" font-weight="650">把 ⌘ Space 变成你自己的入口</text>
    <text x="0" y="249" fill="#6e6a61" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="21">应用、文件、网站与最近常用，一次键入即可抵达。</text>
    <line x1="0" y1="289" x2="585" y2="289" stroke="#171612" stroke-opacity="0.24"/>
    <text x="0" y="322" fill="#6e6a61" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">LOCAL FIRST</text>
    <text x="160" y="322" fill="#6e6a61" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">OPEN SOURCE</text>
    <text x="318" y="322" fill="#6e6a61" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">NATIVE APPKIT</text>
  </g>

  <g transform="translate(698 42)">
    <rect width="452" height="316" rx="24" fill="#e7e1d3" stroke="#171612" stroke-opacity="0.24"/>
    <text x="28" y="35" fill="#6e6a61" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5">⌘ SPACE / SEARCH</text>
    <rect x="28" y="56" width="396" height="58" rx="17" fill="#fffdf7" stroke="#171612" stroke-opacity="0.28"/>
    <circle cx="54" cy="84" r="10" fill="none" stroke="#171612" stroke-width="2"/>
    <path d="M61 92l9 9" stroke="#171612" stroke-width="2" stroke-linecap="round"/>
    <text x="86" y="93" fill="#171612" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="650">.pdf</text>
    <rect x="144" y="72" width="3" height="28" fill="#d65336"/>

    <g transform="translate(28 135)">
      <rect width="396" height="72" rx="14" fill="#fffdf7"/>
      <rect width="5" height="72" rx="2.5" fill="#d65336"/>
      <rect x="18" y="17" width="35" height="40" rx="6" fill="#f1eee4" stroke="#171612" stroke-opacity="0.24"/>
      <text x="26" y="43" fill="#d65336" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">PDF</text>
      <text x="68" y="30" fill="#171612" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="650">report.pdf</text>
      <text x="68" y="54" fill="#6e6a61" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">19:20 · ~/Documents</text>
      <text x="334" y="43" fill="#6e6a61" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">FILE</text>
    </g>

    <g transform="translate(28 216)">
      <rect width="396" height="52" rx="12" fill="#f1eee4" stroke="#171612" stroke-opacity="0.16"/>
      <text x="18" y="32" fill="#171612" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">notes.md</text>
      <text x="278" y="32" fill="#6e6a61" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">RECENT FIRST</text>
    </g>

    <g transform="translate(28 281)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">
      <text x="0" y="0" fill="#d65336">.PDF</text>
      <text x="66" y="0" fill="#6e6a61">.MD</text>
      <text x="120" y="0" fill="#6e6a61">APP</text>
      <text x="180" y="0" fill="#6e6a61">WEB</text>
      <text x="238" y="0" fill="#6e6a61">⌘↩ FINDER</text>
    </g>
  </g>
</svg>
